name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new advisories can appear without any change to this repo.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis (strict-casts / strict-inference / strict-raw-types)
        run: flutter analyze --fatal-infos
      - name: Unit + widget tests
        # `screenshots` renders PNGs for design review; it asserts nothing.
        run: flutter test --exclude-tags screenshots --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  security:
    name: Dependency & configuration security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install osv-scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@latest && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Security gate
        run: tool/security_check.sh

  build-android:
    name: Build (Android, mock backend)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Debug build with the dev config
        run: flutter build apk --debug --dart-define-from-file=config/dev.json
